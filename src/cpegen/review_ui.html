<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpegen review — annotation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root{
  --blue-dark:#1F4E79; --blue:#2E6CB5; --blue-pale:#E8F0F8; --blue-paler:#F6F9FC;
  --ink:#16232E; --grey:#5B6B77; --grey-light:#8B99A3; --line:#DCE6EF;
  --green:#2E7D5B; --green-pale:#EAF3EE; --red:#A94442; --red-pale:#F9EDED;
  --amber:#B5762E; --amber-pale:#FBF6EC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Space Grotesk',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--blue-paler);line-height:1.5;font-size:15px}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}

header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--blue-dark);margin-bottom:18px}
h1{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--blue-dark)}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--grey-light)}
.meta b{color:var(--blue-dark)}
.progressbar{flex-basis:100%;height:8px;border-radius:6px;background:var(--blue-pale);overflow:hidden}
.progressbar div{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:6px;transition:width .2s}

.layout{display:grid;grid-template-columns:230px 1fr 300px;gap:18px;align-items:start}
@media(max-width:1180px){.layout{grid-template-columns:210px 1fr}.side{grid-column:1/-1}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{grid-column:auto}}

/* queue list */
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:78vh;display:flex;flex-direction:column}
.listhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.ftab{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;cursor:pointer;color:var(--grey)}
.ftab.active{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.rows{overflow-y:auto;flex:1}
.rowitem{padding:8px 14px;border-bottom:1px solid var(--blue-paler);cursor:pointer;font-size:12px;color:var(--grey);
  display:flex;gap:8px;align-items:baseline}
.rowitem:hover{background:var(--blue-paler)}
.rowitem.current{background:var(--blue-pale)}
.rowitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--line);position:relative;top:-1px}
.dot.annotated{background:var(--green)}
.dot.not_software{background:var(--grey-light)}
.dot.skipped{background:var(--amber)}
.dot.in_progress{background:#fff;border:2px solid var(--blue);width:6px;height:6px}

/* work card */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;display:flex;flex-direction:column;gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:4px;padding:3px 9px}
.chip.stratum-random{background:var(--blue-pale);color:var(--blue-dark)}
.chip.stratum-hard{background:var(--amber-pale);color:var(--amber)}
.chip.feat{background:var(--blue-paler);color:var(--grey);border:1px solid var(--line)}
.chip.origin{background:var(--green-pale);color:var(--green)}
.chip.draft{background:var(--blue-pale);color:var(--blue-dark);border:1px dashed var(--blue)}

/* the three-level workspace */
.lvl{border:1px solid var(--line);border-radius:10px;background:var(--blue-paler)}
.lvl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--disp);font-weight:700;
  font-size:13px;color:var(--blue-dark);padding:12px 16px}
.lvl-sub{font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--grey-light)}
.lvl-body{padding:0 16px 16px}

details.lvl summary{list-style:none;cursor:pointer}
details.lvl summary::-webkit-details-marker{display:none}
details.lvl summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--blue);
  transition:transform .15s}
details.lvl[open] summary::before{transform:rotate(90deg)}
details.lvl .lvl-head{border-bottom:1px solid var(--line)}
details.lvl[open] .lvl-body{padding-top:14px}

.titlebox{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:#fff;margin-bottom:8px}
.titlelabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-light);margin-bottom:8px}
#title{font-family:var(--mono);font-size:19px;font-weight:600;line-height:2.15;user-select:text;cursor:text;word-break:break-all}
#title .tk{position:relative;padding:3px 1px;border-radius:4px}
#title .tk.v{background:var(--blue-pale);color:var(--blue-dark);outline:1.5px solid var(--blue)}
#title .tk.p{background:var(--blue-dark);color:#fff}
#title .tk.b{background:var(--green-pale);color:var(--green);outline:1.5px solid var(--green)}
#title .tk.x{background:var(--amber-pale);color:var(--amber);outline:1.5px dashed var(--amber)}
/* a word can carry more than one tag at once (2026-08-15, "Apple Mobile
   Device Support" — vendor AND part of product); the background above
   shows the first tag applied, these stacked dots show every tag */
#title .tk .tagdots{position:absolute;left:2px;right:2px;bottom:-5px;display:flex;gap:2px;height:3px}
#title .tk .tagdots i{flex:1;min-width:3px;border-radius:1px;display:block}
#title .tk .tagdots i.dot-v{background:var(--blue)}
#title .tk .tagdots i.dot-p{background:var(--blue-dark)}
#title .tk .tagdots i.dot-b{background:var(--green)}
#title .tk .tagdots i.dot-x{background:var(--amber)}
.hint{font-size:12px;color:var(--grey-light);margin-bottom:14px}
.hint kbd{font-family:var(--mono);font-size:10.5px;background:var(--blue-pale);color:var(--blue-dark);border-radius:3px;padding:1px 5px}

.entbtns{display:flex;gap:8px;flex-wrap:wrap}
.ebtn{font-family:var(--disp);font-weight:700;font-size:13px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;padding:7px 14px;cursor:pointer;color:var(--grey)}
.ebtn.v{border-color:var(--blue)}   .ebtn.v:hover,.ebtn.v.armed{background:var(--blue-pale);color:var(--blue-dark)}
.ebtn.p{border-color:var(--blue-dark)} .ebtn.p:hover,.ebtn.p.armed{background:var(--blue-dark);color:#fff}
.ebtn.b{border-color:var(--green)}  .ebtn.b:hover,.ebtn.b.armed{background:var(--green-pale);color:var(--green)}
.ebtn.x{border-color:var(--amber)}  .ebtn.x:hover,.ebtn.x.armed{background:var(--amber-pale);color:var(--amber)}
.ebtn.clear{border-style:dashed}    .ebtn.clear:hover{background:var(--red-pale);color:var(--red)}

.outrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.outrow label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-light);text-align:right}
.outrow input{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:100%;background:#fff;color:var(--ink)}
.outrow input:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
#preview{background:var(--blue-paler)}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.abtn{font-family:var(--disp);font-weight:700;font-size:14px;border-radius:9px;padding:10px 18px;cursor:pointer;border:1.5px solid transparent}
.abtn.save{background:var(--green);color:#fff}       .abtn.save:hover{filter:brightness(1.08)}
.abtn.draft{background:#fff;color:var(--blue-dark);border-color:var(--blue)} .abtn.draft:hover{background:var(--blue-pale)}
.abtn.nosw{background:#fff;color:var(--grey);border-color:var(--line)} .abtn.nosw:hover{background:var(--blue-paler)}
.abtn.skipb{background:#fff;color:var(--amber);border-color:var(--amber)} .abtn.skipb:hover{background:var(--amber-pale)}
.nav{margin-left:auto;display:flex;gap:6px}
.nbtn{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--grey)}
.nbtn:hover{background:var(--blue-paler)}

#flash{font-size:13px;border-radius:8px;padding:9px 14px;display:none}
#flash.ok{display:block;background:var(--green-pale);color:var(--green)}
#flash.err{display:block;background:var(--red-pale);color:var(--red)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.cfield span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-light);margin-bottom:2px}
.cfield input{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink);background:#fff}
.cfield input:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
.cfield select{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink);background:#fff}
.cfield select:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
.ta-wrap{position:relative}
.ta-list{position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--line);
  border-radius:8px;margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(22,35,46,.14);display:none}
.ta-item{padding:6px 10px;font-family:var(--mono);font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
.ta-item:hover,.ta-item.active{background:var(--blue-pale)}
.ta-count{color:var(--grey-light);font-size:10px}
.cbtn{font-family:var(--mono);font-size:11px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer;color:var(--grey)}
.cbtn:hover{background:var(--blue-paler)}
.cbtn.primary{border-color:var(--blue);color:var(--blue-dark)}
.cbtn.primary:hover{background:var(--blue-pale)}

#wfnfield{width:100%;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;background:#fff;color:var(--ink);resize:vertical;min-height:52px}
#wfnfield:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
#wfnout{margin-top:8px;font-size:12.5px}
.cpeok{font-family:var(--disp);font-weight:700;color:var(--green);border:2px solid var(--green);border-radius:6px;padding:2px 8px;background:var(--green-pale);font-size:11px;letter-spacing:.08em}
.cpeko{font-family:var(--disp);font-weight:700;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:2px 8px;background:var(--red-pale);font-size:11px;letter-spacing:.08em}
.cpestr{font-family:var(--mono);font-size:12px;color:var(--blue-dark);background:var(--blue-pale);padding:2px 6px;border-radius:4px;word-break:break-all}
.wfnstr{font-family:var(--mono);font-size:10.5px;color:var(--grey-light);display:block;margin-top:4px;word-break:break-all}
.cpeerr{color:var(--red);font-family:var(--mono);font-size:11px;margin-top:3px}
.donecard{padding:40px;text-align:center;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--green)}

/* dictionary match stamp (level 4) */
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dchip{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:4px 10px;display:inline-block}
.dchip.yes{background:var(--green-pale);color:var(--green)}
.dchip.no{background:var(--amber-pale);color:var(--amber)}
.dchip.unk{background:var(--blue-paler);color:var(--grey-light);border:1px solid var(--line)}
.dcand{font-size:12px;border-radius:8px;padding:8px 12px;border:1px dashed transparent}
.dcand b{font-family:var(--disp)}
.dcand.info{color:var(--blue-dark);background:var(--blue-pale);border-color:var(--blue)}
.dcand.warn{color:var(--amber);background:var(--amber-pale);border-color:var(--amber)}
.dcand.bad{color:var(--red);background:var(--red-pale);border-color:var(--red)}
/* "Add to dictionary" — mint the row's candidate CPE as a NIE (point 4,
   design 2026-08-15): target defaults to the MotherHacker community
   dictionary; any other text mints a per-client custom dictionary CSV */
.nieform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.nieform label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-light);display:flex;align-items:center;gap:6px}
.nieform input{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink);background:#fff;width:150px}
.nieform input:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
.niedone{font-family:var(--mono);font-size:11.5px;color:var(--green)}

/* "Advanced review" wizard (design 2026-08-21): vendor -> product -> version
   step by step, each step fed by the /api/assist helper registry; the
   remaining 8 components are plain fields on the last step. Lands in the
   normal builder on finish/exit. Helpers propose; the notary validates. */
.abtn.adv{background:#fff;color:var(--blue-dark);border-color:var(--blue-dark)} .abtn.adv:hover{background:var(--blue-pale)}
.wiz-overlay{position:fixed;inset:0;background:rgba(22,35,46,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.wiz{background:#fff;border-radius:14px;max-width:860px;width:100%;box-shadow:0 20px 60px rgba(22,35,46,.3);display:flex;flex-direction:column;gap:14px;padding:22px 26px}
.wiz-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--blue-dark);padding-bottom:10px}
.wiz-head h2{font-family:var(--disp);font-size:18px;color:var(--blue-dark)}
.wiz-steps{display:flex;gap:6px;margin-left:auto}
.wstep{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--grey)}
.wstep.cur{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.wstep.done{background:var(--green-pale);border-color:var(--green);color:var(--green)}
.wiz-title{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--blue-paler);border:1px solid var(--line);border-radius:8px;padding:8px 12px;word-break:break-all}
.wiz-title .hl{background:var(--blue-pale);outline:1.5px solid var(--blue);border-radius:3px;padding:1px 2px}
.wiz-field{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.wiz-field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey-light);text-align:right}
.wiz-field input{font-family:var(--mono);font-size:14px;border:1px solid var(--blue);border-radius:8px;padding:9px 12px;width:100%;color:var(--ink)}
.wiz-field input:focus{outline:2px solid var(--blue-pale)}
.wiz-src{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--blue-paler)}
.wiz-src-head{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--blue-dark);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.wsrc{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.wsrc.title{background:var(--blue-pale);color:var(--blue-dark)}
.wsrc.dictionary{background:var(--green-pale);color:var(--green)}
.wsrc.llm{background:#F1ECFA;color:#5B3E96}
.wsrc.web{background:var(--blue-paler);color:var(--grey);border:1px solid var(--line)}
.wsrc.transform{background:var(--amber-pale);color:var(--amber)}
.wcands{display:flex;flex-wrap:wrap;gap:6px}
.wcand{font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);text-align:left;max-width:100%}
.wcand:hover{border-color:var(--blue);background:var(--blue-pale)}
.wcand.picked{border-color:var(--green);background:var(--green-pale)}
.wcand.invalid{border-color:var(--red);color:var(--red);text-decoration:line-through;cursor:not-allowed}
.wcand small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--grey-light);margin-top:2px}
.wcand.link{text-decoration:none;display:inline-block}
.wiz-empty{font-size:12px;color:var(--grey-light);font-style:italic}
.wiz-rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wiz-actions{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.wiz-actions .nav{margin-left:auto}
.wiz-note{font-size:11.5px;color:var(--grey-light)}

/* right sidebar */
.side{display:flex;flex-direction:column;gap:14px}
.side-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.side-head{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--blue-dark);margin-bottom:10px;
  letter-spacing:.02em}
.side-empty{font-size:12px;color:var(--grey-light);font-style:italic}
.sugg{font-size:12.5px;color:var(--grey)}
.sugg .m{font-family:var(--mono);font-size:12px;color:var(--ink);display:block;margin-bottom:4px}
.sugg .apply{margin-top:6px;font-family:var(--mono);font-size:11px;font-weight:600;border:1px solid var(--amber);
  background:#fff;color:var(--amber);border-radius:6px;padding:3px 10px;cursor:pointer}
.sugg .why{font-size:11px;color:var(--grey-light);margin-top:6px}
.hist-item{border-left:3px solid var(--line);padding:4px 0 8px 10px;margin-bottom:8px;font-size:11.5px}
.hist-item:last-child{margin-bottom:0}
.hist-v{font-family:var(--mono);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.04em;
  border-radius:4px;padding:1px 6px;display:inline-block;margin-bottom:3px}
.hist-v.annotated{background:var(--green-pale);color:var(--green)}
.hist-v.not_software{background:var(--blue-paler);color:var(--grey)}
.hist-v.skipped{background:var(--amber-pale);color:var(--amber)}
.hist-meta{color:var(--grey-light);font-family:var(--mono);font-size:10.5px;display:block}
.hist-notes{color:var(--grey);margin-top:3px}
#notes{width:100%;min-height:140px;font-family:var(--sans);font-size:13px;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;resize:vertical;color:var(--ink)}
#notes:focus{outline:2px solid var(--blue-pale);border-color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>cpegen review <span style="color:var(--blue);font-size:14px">annotation mode</span></h1>
    <div class="meta" id="meta">loading…</div>
    <div class="progressbar"><div id="pbar" style="width:0%"></div></div>
  </header>

  <div class="layout">
    <aside class="list">
      <div class="listhead">
        <button class="ftab active" data-f="all">All</button>
        <button class="ftab" data-f="pending">Pending</button>
        <button class="ftab" data-f="done">Done</button>
      </div>
      <div class="rows" id="rows"></div>
    </aside>

    <main class="card" id="card"></main>

    <aside class="side" id="side"></aside>
  </div>
</div>

<script>
"use strict";
let STATE=null, CUR=0, FILTER="all", ARMED=null; // ARMED: pending entity for next selection
const LABELS={v:"cpe_vendor", p:"cpe_product", b:"cpe_version"};
const CLASSOF={cpe_vendor:"v", cpe_product:"p", cpe_version:"b"};
const GOLD=new Set(["v","p","b"]); // the only marks that reach annotated_title/goldset

// Every span-annotatable CPE component. v/p/b feed the frozen gold
// annotation (RASA brackets, goldset.parse_annotation) AND the builder;
// the rest (feedback 2026-08-14: "falten els botons per anotar la resta
// de components") only ever feed the builder — title highlights, never
// brackets, so the NER gold format never changes shape. `part` has no
// button: it's driven by the dropdown + the dictionary's suggested_part.
const ENTITY_BUTTONS=[
  {key:"v", label:"Vendor", attr:"vendor", gold:true},
  {key:"p", label:"Product", attr:"product", gold:true},
  {key:"b", label:"Version", attr:"version", gold:true},
  {key:"u", label:"Update", attr:"update"},
  {key:"ed", label:"Edition", attr:"edition"},
  {key:"lg", label:"Language", attr:"language"},
  {key:"sw", label:"SW Edition", attr:"sw_edition"},
  {key:"ts", label:"Target SW", attr:"target_sw"},
  {key:"th", label:"Target HW", attr:"target_hw"},
  {key:"ot", label:"Other", attr:"other"},
];
function tkClass(cls){ return GOLD.has(cls) ? cls : (cls ? "x" : ""); }

// A title word can carry more than one span at once (feedback 2026-08-15:
// "Apple Mobile Device Support" — "Apple" is both the vendor AND part of
// the product name). `marks[k]` is therefore an ARRAY of active codes, not
// a single string; the background color still reflects the first one
// applied (`tokenClasses`), and any further ones show as small colored
// dots stacked under the word (`tokenDotsHtml`) so nothing is silently
// hidden. Click the same entity button on an already-tagged word again to
// untag just that one mark (`paint` toggles, see below).
function tokenClasses(marks){ return marks && marks.length ? tkClass(marks[0]) : ""; }
function tokenDotsHtml(marks){
  if(!marks || marks.length<2) return "";
  return `<span class="tagdots">${marks.map(c=>`<i class="dot-${GOLD.has(c)?c:"x"}"></i>`).join("")}</span>`;
}
function tokenInnerHtml(t, marks){ return escapeHtml(t)+tokenDotsHtml(marks); }

// per-row working state: token marks (spans), builder components, the
// editable WFN/formatted-string field. Kept in memory across navigation
// within the session; a "Save draft" writes it all to the server as
// verdict=in_progress so it survives a reload too (portal v2, 2026-08-14).
const WORK={};

function isDone(st){ return st==="annotated" || st==="not_software"; }
function isPending(st){ return !st || st==="skipped" || st==="in_progress"; }

function tokens(title){
  // split keeping separators as their own tokens; annotate word-tokens only
  return title.split(/(\s+)/).filter(t=>t.length);
}

async function api(path, opts){ const r=await fetch(path, opts); return r.json(); }

function rowStatus(row){ return row.verdict || ""; }

function parseBrackets(s){
  const out=[]; const re=/\[([^\]]+)\]\((cpe_vendor|cpe_product|cpe_version)\)/g; let m;
  while((m=re.exec(s))) out.push({text:m[1], label:m[2]});
  return out;
}

function initWork(i){
  const row=STATE.rows[i]; const tks=tokens(row.title);
  const marks=tks.map(()=>[]);  // one array of active codes per token
  // seed spans from an existing annotated_title — real annotation AND a
  // saved draft use the same RASA-bracket column, so this resumes both.
  // ADD (never overwrite): with overlap (2026-08-15) the same token can
  // legitimately be found by more than one bracket entity.
  for(const ent of parseBrackets(row.annotated_title||"")){
    const words=ent.text.trim().split(/\s+/); if(!words.length) continue;
    outer: for(let a=0;a<tks.length;a++){
      if(tks[a].trim().toLowerCase()!==words[0].toLowerCase()) continue;
      let b=a, w=1, j=a+1;
      while(w<words.length && j<tks.length){
        if(!tks[j].trim()){j++;continue;}
        if(tks[j].trim().toLowerCase()!==words[w].toLowerCase()) continue outer;
        b=j; w++; j++;
      }
      if(w===words.length){
        const cls=CLASSOF[ent.label];
        for(let k=a;k<=b;k++) if(tks[k].trim() && !marks[k].includes(cls)) marks[k].push(cls);
        break;
      }
    }
  }
  // seed the builder + WFN field: an in-progress draft wins, else a
  // stored (final, notary-validated) cpe seeds the WFN field read-only-ish
  let compvals=null, wfnText="", extraMarks={}, llm=null;
  if(row.verdict==="in_progress" && row.draft){
    try{
      const draft=JSON.parse(row.draft);
      compvals=draft.components||null;
      wfnText=draft.cpe_text||"";
      extraMarks=draft.extra_marks||{};
      // the wizard's cached LLM answer (2026-08-21): resumed, never re-asked
      if(draft.llm_entities && Object.keys(draft.llm_entities).length) llm=draft.llm_entities;
    }catch(e){ /* corrupt draft: fall back to blank, never crash the UI */ }
  } else if(row.cpe){
    wfnText=row.cpe;
  }
  // overlay the non-gold spans (update/edition/... — never in
  // annotated_title, so they're not covered by the seeding loop above).
  // Accepts both the pre-overlap draft shape ({idx: "code"}) and the
  // current one ({idx: ["code", ...]}) so an already-saved in-progress
  // row from before this feature still resumes correctly.
  Object.entries(extraMarks).forEach(([k,vals])=>{
    const idx=+k; if(!(idx>=0 && idx<marks.length)) return;
    (Array.isArray(vals)?vals:[vals]).forEach(c=>{
      if(c && !marks[idx].includes(c)) marks[idx].push(c);
    });
  });
  WORK[i]={tks, marks, compvals, wfnText, llm};
}

function classRuns(tks, marks, cls){
  // maximal contiguous runs of tokens carrying `cls` — bridges a single
  // whitespace separator between two same-class words (so "Mobile Device
  // Support" stays one run, not three), exactly like the pre-overlap
  // version did for its one-mark-per-token array.
  const runs=[]; let k=0;
  while(k<tks.length){
    if(!(tks[k].trim() && marks[k].includes(cls))){ k++; continue; }
    const start=k, seg=[];
    while(k<tks.length && (marks[k].includes(cls)
          || (!tks[k].trim() && k+1<tks.length && marks[k+1].includes(cls)))){
      seg.push(tks[k]); k++;
    }
    runs.push({start, text: seg.join("").trim()});
  }
  return runs;
}

function bracketString(i){
  // only v/p/b ever become brackets — this is what apply_verdict writes to
  // annotated_title and what goldset.parse_annotation reads back, so the
  // gold NER format is untouched by the extra component buttons.
  //
  // Each gold class is reconstructed independently from EVERY token that
  // carries it, regardless of what other classes the same token also
  // carries (2026-08-15, "Apple Mobile Device Support": "Apple" is both
  // vendor and part of the product span, so the product bracket must
  // include it too, not just the words where product happens to be the
  // only mark). goldset.parse_annotation only ever scans the whole string
  // for [text](label) — never by position — so per-class segments need no
  // interleaving with the untagged words between them; they are sorted by
  // starting position purely for readability when a human opens the CSV.
  const {tks,marks}=WORK[i];
  const segs=[];
  for(const cls of ["v","p","b"]){
    classRuns(tks, marks, cls).forEach(r=>
      segs.push({start:r.start, text:`[${r.text}](${LABELS[cls]})`}));
  }
  segs.sort((a,b)=>a.start-b.start);
  return segs.map(s=>s.text).join(" ");
}

function renderList(){
  const box=document.getElementById("rows"); box.innerHTML="";
  STATE.rows.forEach((row,i)=>{
    const st=rowStatus(row);
    if(FILTER==="pending" && !isPending(st)) return;
    if(FILTER==="done" && !isDone(st)) return;
    const d=document.createElement("div");
    d.className="rowitem"+(i===CUR?" current":"");
    d.innerHTML=`<span class="dot ${st}"></span><span class="t">${escapeHtml(row.title)}</span>`;
    d.onclick=()=>{CUR=i; render();};
    box.appendChild(d);
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function featChips(row){
  const feats=[["has_parens","parens"],["has_arch_locale_tokens","arch/locale"],
    ["vendor_in_alias_table","vendor in aliases"],["versioned_family","versioned family"],
    ["direct_dice_ge_085","direct dice ≥.85"]];
  return feats.filter(([k])=>row[k]==="True").map(([,l])=>`<span class="chip feat">${l}</span>`).join("");
}

function render(){
  const row=STATE.rows[CUR];
  if(!WORK[CUR]) initWork(CUR);
  const p=STATE.progress;
  document.getElementById("meta").innerHTML=
    `reviewer <b>${escapeHtml(STATE.identity)}</b> · ${p.done}/${p.total} done · `+
    `${p.annotated} annotated · ${p.not_software} not-software · ${p.skipped} skipped`;
  document.getElementById("pbar").style.width=(100*p.done/p.total)+"%";
  renderList();

  const card=document.getElementById("card");

    return;

  const {tks,marks}=WORK[CUR];
  const sugg=row.suggested_vendor||row.suggested_product;
  const draftBadge=row.verdict==="in_progress" ? `<span class="chip draft">in progress</span>` : "";
  card.innerHTML=`
    <div class="chips">
      <span class="chip origin">${escapeHtml(row.origin)}</span>
      <span class="chip stratum-${row.stratum}">${row.stratum}</span>
      ${featChips(row)}
      ${draftBadge}
      <span class="chip feat">#${CUR+1}/${STATE.rows.length}</span>
    </div>

    <details class="lvl" id="lvl1" open>
      <summary>
        <span class="lvl-head" style="display:inline-flex;padding:0">1 &middot; Title spans
          <span class="lvl-sub">select tokens on the raw title, then assign an entity</span>
        </span>
      </summary>
      <div class="lvl-body">
        <div class="titlebox">
          <div class="titlelabel">raw title</div>
          <div id="title">${tks.map((t,k)=>t.trim()
            ? `<span class="tk ${tokenClasses(marks[k])}" data-k="${k}">${tokenInnerHtml(t, marks[k])}</span>`
            : escapeHtml(t)).join("")}</div>
        </div>
        <div class="hint">Click a word (or drag across several) then press
          <kbd>V</kbd> vendor · <kbd>P</kbd> product · <kbd>B</kbd> version ·
          <kbd>X</kbd> clear word · <kbd>Enter</kbd> save · <kbd>N</kbd> not software ·
          <kbd>S</kbd> skip · <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> navigate.
          Or arm an entity button first and click words to paint them.
          Vendor/Product/Version feed the frozen gold annotation; the other
          component buttons below only fill the builder (step 2). A word can
          carry more than one tag at once (e.g. vendor AND product, like

        <div class="entbtns">
          ${ENTITY_BUTTONS.map(eb=>`<button class="ebtn ${eb.gold?eb.key:"x"}" data-e="${eb.key}">${eb.label}</button>`).join("")}

    </details>

    <div class="outrow"><label>annotated</label><input id="preview" readonly value=""></div>

    <div class="lvl" id="lvl2">

        <button class="cbtn" id="prefill" style="margin-left:auto">Prefill from annotation</button>

      </div>
      <div class="lvl-body">

        <div id="wfnout">${row.cpe?`<span class="cpeok">VALID ✓</span> <code class="cpestr">${escapeHtml(row.cpe)}</code>`:""}</div>
      </div>
    </div>

    <div class="lvl" id="lvl4">
      <div class="lvl-head">4 &middot; Dictionary match
        <span class="lvl-sub">per-field stamp against the official (NVD) dictionary — candidates can be minted into a custom dictionary</span>
      </div>

    </div>

    <div class="actions">
      <button class="abtn save" id="save">Save &amp; next ⏎</button>
      <button class="abtn draft" id="savedraft" title="Save partial work without marking this row done">Save draft</button>
      <button class="abtn nosw" id="nosw">Not software (N)</button>
      <button class="abtn skipb" id="skip">Skip (S)</button>
      <button class="abtn adv" id="advreview" title="Step-by-step vendor → product → version with helper candidates (title / dictionary / LLM / web)">Advanced review</button>

        <button class="nbtn" id="prev">&larr;</button>

  side.innerHTML=`
    <div class="side-block">
      <div class="side-head">Dictionary hint</div>

        (${escapeHtml(row.suggested_part)||"a"}) — dice ${escapeHtml(row.dice)}, margin ${escapeHtml(row.margin)}, <b>${escapeHtml(row.decision)}</b>
        ${row.runner_up?` &middot; runner-up <span class="m" style="display:inline">${escapeHtml(row.runner_up)}</span>`:""}
        <button class="apply" id="applysugg">highlight in title</button>
        <div class="why">Canonical spelling — a hint to guide your selection, never the answer. Highlights only literal matches.</div>
      </div>`:`<div class="side-empty">No dictionary hint for this title.</div>`}
    </div>
    <div class="side-block">
      <div class="side-head">Verdict history</div>
      <div id="history"><div class="side-empty">loading…</div></div>
    </div>

      <div class="side-head">Notes</div>
      <textarea id="notes" placeholder="Evidence, rationale, NIE candidates...">${escapeHtml(row.notes||"")}</textarea>

const CPE_ATTRS=["part","vendor","product","version","update","edition","language","sw_edition","target_sw","target_hw","other"];
const PART_VALUES=["*","a","o","h","-"];
const TA_FIELDS=["vendor","product"]; // official component search (typeahead)
function defaultComp(a,row){
  if(a==="part") return row.suggested_part||"*";
  if(a==="target_sw"){ const m=row.title.toLowerCase().match(/\bfor ([a-z0-9._+-]+)\s*$/); if(m) return m[1]; }
  return "*";
}
function cfieldHtml(a,row){
  const val=escapeHtml((WORK[CUR].compvals&&WORK[CUR].compvals[a])||defaultComp(a,row));
  if(a==="part"){
    return `<label class="cfield"><span>part</span><select data-attr="part">`+
      PART_VALUES.map(p=>`<option value="${p}"${p===val?" selected":""}>${p}</option>`).join("")+
      `</select></label>`;
  }
  if(TA_FIELDS.includes(a)){
    return `<label class="cfield"><span>${a}</span><div class="ta-wrap">`+
      `<input data-attr="${a}" data-ta="${a}" autocomplete="off" value="${val}">`+
      `<div class="ta-list" id="ta-${a}"></div></div></label>`;
  }
  return `<label class="cfield"><span>${a}</span><input data-attr="${a}" value="${val}"></label>`;
}
function spanText(cls){
  // overlap-aware (2026-08-15): picks up a token for this class regardless
  // of what OTHER classes also mark it, so e.g. a word tagged both vendor
  // and product still contributes to both fields' prefill text.
  const {tks,marks}=WORK[CUR]; const segs=[]; let cur=[];
  tks.forEach((t,k)=>{ if(t.trim()&&marks[k].includes(cls)) cur.push(t.trim()); else if(cur.length){segs.push(cur.join(" ")); cur=[];} });
  if(cur.length) segs.push(cur.join(" "));
  return segs.join(" ");
}
function readComponents(){
  const out={};
  document.querySelectorAll(".cgrid input, .cgrid select").forEach(i=>{ out[i.dataset.attr]=i.value.trim(); });
  return out;
}
function collectComponents(){
  const c=readComponents();
  const touched=CPE_ATTRS.some(a=>a!=="part"&&a!=="target_sw"&&c[a]&&c[a]!=="*");
  return touched?c:null;
}
function updatePreview(){
  document.getElementById("preview").value=bracketString(CUR);
}

// Toggles a mark on a token by default (click the same entity on an
// already-tagged word again to remove just that tag — needed once a word
// can hold several tags at once). Pass {add:true} for programmatic callers
// (resume-from-suggestion) that must never accidentally remove a tag.
function paint(k, cls, opts){
  const w=WORK[CUR]; if(!w.tks[k] || !w.tks[k].trim()) return;
  if(cls===""){
    w.marks[k]=[];  // "Clear word": wipe every tag on this token
  } else if(opts && opts.add){
    if(!w.marks[k].includes(cls)) w.marks[k].push(cls);
  } else {
    const arr=w.marks[k]; const pos=arr.indexOf(cls);
    if(pos>=0) arr.splice(pos,1); else arr.push(cls);
  }
  const el=document.querySelector(`#title .tk[data-k="${k}"]`);
  if(el){ el.className="tk "+tokenClasses(w.marks[k]); el.innerHTML=tokenInnerHtml(w.tks[k], w.marks[k]); }
  updatePreview();
}

function selectedTokenKeys(){
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed) return [];
  const keys=[];
  document.querySelectorAll("#title .tk").forEach(el=>{
    if(sel.containsNode(el, true)) keys.push(+el.dataset.k);
  });
  return keys;
}

function assign(cls){
  const keys=selectedTokenKeys();
  if(keys.length){ keys.forEach(k=>paint(k, cls)); window.getSelection().removeAllRanges(); }
  ARMED=null; document.querySelectorAll(".ebtn").forEach(b=>b.classList.remove("armed"));
}

function flash(msg, ok){
  const f=document.getElementById("flash");
  f.className=ok?"ok":"err"; f.textContent=msg;
  if(ok) setTimeout(()=>{f.className=""; f.style.display="none";}, 1200);
}

// -- WFN <-> builder sync (portal v2, 2026-08-14): the notary's bind/unbind
// are the only two directions; whichever field the reviewer edited last
// pushes into the other. At submit time, if the WFN field holds text, it
// is authoritative — "if they diverge, WFN wins" (design decision).

async function bindFromBuilder(){
  const comps=readComponents();
  WORK[CUR].compvals=comps;
  const res=await api("/api/bind",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({components:comps})});
  const field=document.getElementById("wfnfield");
  const out=document.getElementById("wfnout");
  if(!field||!out) return;
  if(res.ok){
    field.value=res.cpe; WORK[CUR].wfnText=res.cpe;
    out.innerHTML=`<span class="cpeok">VALID ✓</span> <code class="cpestr">${escapeHtml(res.cpe)}</code><span class="wfnstr">${escapeHtml(res.wfn)}</span>`;
  } else {
    out.innerHTML=(res.errors||[]).length
      ? `<span class="cpeko">REJECTED ✕</span>${res.errors.map(e=>`<div class="cpeerr">${escapeHtml(e)}</div>`).join("")}`
      : "";
  }
  checkDictMatch();
}

async function unbindFromWfn(){
  const field=document.getElementById("wfnfield");
  if(!field) return;
  const text=field.value.trim();
  WORK[CUR].wfnText=text;
  const out=document.getElementById("wfnout");
  if(!text){ if(out) out.innerHTML=""; return; }
  const res=await api("/api/unbind",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpe:text})});
  if(!res.ok){
    if(out) out.innerHTML=(res.errors||[]).map(e=>`<div class="cpeerr">${escapeHtml(e)}</div>`).join("");
    return;
  }
  WORK[CUR].compvals=res.components;
  CPE_ATTRS.forEach(a=>{
    const el=document.querySelector(`.cgrid [data-attr="${a}"]`);
    if(el) el.value=res.components[a]; // programmatic: no input event, no bind-loop
  });
  if(out) out.innerHTML=`<span class="cpeok">VALID ✓</span> <code class="cpestr">${escapeHtml(res.cpe)}</code><span class="wfnstr">${escapeHtml(res.wfn)}</span>`;
  checkDictMatch();
}

// Portal v2 point 4 (design 2026-08-14, feedback "afegiria un punt 4..."):
// per-field stamp against the official (NVD) dictionary. A vendor/product
// that doesn't match is marked a "new candidate" — it can still be BOUND
// and pass the ABNF validator (syntax), but only a MotherHacker community
// dictionary or a client's custom dictionary can validate it for
// inclusion (the same human+notary ceremony as a NIE). Purely
// informational/live — never persisted, never blocks anything.
// The "Add to dictionary" mint form (design 2026-08-15) is independent of
// whether the typeahead sidecar is loaded at all: dictcheck only tells you
// WHETHER a row looks like a candidate, but a reviewer can decide to mint
// a NIE for any row that already has a notary-validated CPE (row.cpe, set
// by step 3 + a real "annotated" verdict — never a draft or preview bind,
// same gate `handle_nie_add` re-checks server-side).
function nieFormHtml(){
  if(!STATE.rows[CUR].cpe){
    return `<div class="side-empty">Save this row with a verdict (step below) before including its CPE in a dictionary — a draft or preview bind isn't enough.</div>`;
  }
  return `<div class="nieform">`
    + `<label>target <input id="nietarget" value="MotherHacker" autocomplete="off"></label>`
    + `<button class="cbtn primary" id="nieadd">Add to dictionary</button>`
    + `<span id="nieout"></span></div>`;
}

async function checkDictMatch(){
  const box=document.getElementById("dictcheck");
  if(!box) return;
  const comps=WORK[CUR].compvals||readComponents();
  const vendor=(comps.vendor||"").trim(), product=(comps.product||"").trim();
  if(!vendor && !product){
    box.innerHTML=`<div class="side-empty">Fill vendor/product in the builder to check the official dictionary.</div>${nieFormHtml()}`;
    bindNieForm();
    return;
  }
  const url=`/api/dictcheck?vendor=${encodeURIComponent(vendor)}&product=${encodeURIComponent(product)}`;
  const res=await api(url);
  if(!res.ok){ box.innerHTML=nieFormHtml(); bindNieForm(); return; }
  if(res.vendor_known===null && res.product_known===null){
    box.innerHTML=`<div class="side-empty">No dictionary sidecar loaded — run 'cpegen dict --export-terms'.</div>${nieFormHtml()}`;
    bindNieForm();
    return;
  }
  const badge=(known,label)=>{
    if(known===null) return `<span class="dchip unk">${label}: n/a</span>`;
    return known ? `<span class="dchip yes">${label}: match ✓</span>` : `<span class="dchip no">${label}: new</span>`;
  };
  // three candidate tiers (heuristic, design 2026-08-14 — the sidecar only
  // ever indexes vendor/product, never version, so "new version" is
  // inferred from "the pair is already known", not verified)
  const CATEGORY_COPY={
    new_version: {cls:"info", label:"NEW VERSION candidate",
      text:"the vendor:product pair matches the official dictionary — if this exact version isn't already catalogued, it's a new version."},
    new_product_version: {cls:"warn", label:"NEW PRODUCT AND VERSION candidate",
      text:"this vendor doesn't have this product in the official dictionary yet — every version of it is new."},
    other: {cls:"bad", label:"OTHER candidate",
      text:"the vendor itself isn't recognized by the official dictionary — possibly a new vendor, a rename, or a typo."},
  };
  let overall="";
  if(res.category){
    const c=CATEGORY_COPY[res.category];
    overall=`<div class="dcand ${c.cls}"><b>${c.label}</b> — ${c.text} Only a MotherHacker community dictionary or a client's custom dictionary can validate it for inclusion.</div>`;
  }
  box.innerHTML=`<div class="dchips">${badge(res.vendor_known,"vendor")}${badge(res.product_known,"product")}</div>${overall}${nieFormHtml()}`;
  bindNieForm();
}

// "Add to dictionary" — mints the row's already-bound CPE (row.cpe) as a
// NIE into the target custom dictionary (POST /api/nie). Free-text target,
// "MotherHacker" by default (design 2026-08-15): the server slugifies
// anything else into its own per-client custom-dictionary CSV. Re-bound
// after every checkDictMatch() re-render, since that replaces box.innerHTML.
function bindNieForm(){
  const btn=document.getElementById("nieadd");
  if(!btn) return;
  btn.onclick=async ()=>{
    const targetEl=document.getElementById("nietarget");
    const target=(targetEl&&targetEl.value||"MotherHacker").trim();
    const out=document.getElementById("nieout");
    btn.disabled=true;
    const res=await api("/api/nie",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({index:CUR, target})});
    btn.disabled=false;
    if(!out) return;
    out.innerHTML=res.ok
      ? `<span class="niedone">added to <b>${escapeHtml(res.origin)}</b> ✓</span>`
      : `<span class="cpeerr">${escapeHtml(res.error||"could not add")}</span>`;
  };
}

let WFN_TIMER=null;

// Resolve what to submit as `components`: the WFN field, when it holds
// text, is authoritative (WFN wins on divergence). Returns null when the
// field is empty (builder-only or no CPE built at all) and an
// {__invalid__} marker when the text doesn't validate, so a real error
// never gets silently swallowed into "no CPE built".
async function resolveComponentsForSubmit(){
  const field=document.getElementById("wfnfield");
  const text=field ? field.value.trim() : "";
  if(!text) return null;
  const res=await api("/api/unbind",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpe:text})});
  if(!res.ok) return {__invalid__:true, errors:res.errors||["invalid WFN/formatted string"]};
  return res.components;
}

// Official component search (typeahead) — assists vendor/product, never
// restricts: free text always stays a valid value (design 2026-08-14).
let TA_TIMER=null, TA_ACTIVE=-1, TA_ITEMS=[], TA_FIELD=null;

function taClose(field){
  const list=document.getElementById("ta-"+field);
  if(list){ list.innerHTML=""; list.style.display="none"; }
  if(TA_FIELD===field){ TA_ACTIVE=-1; TA_ITEMS=[]; TA_FIELD=null; }
}

function taRender(field, items){
  TA_ITEMS=items; TA_FIELD=field;
  const list=document.getElementById("ta-"+field);
  if(!list) return;
  if(!items.length){ list.style.display="none"; list.innerHTML=""; return; }
  list.innerHTML=items.map((it,i)=>
    `<div class="ta-item${i===TA_ACTIVE?" active":""}" data-i="${i}">`+
    `<span>${escapeHtml(it.value)}</span><span class="ta-count">${it.count}</span></div>`
  ).join("");
  list.style.display="block";
  list.querySelectorAll(".ta-item").forEach(el=>{
    el.onmousedown=(e)=>{ e.preventDefault(); taPick(field, +el.dataset.i); };
  });
}

function taPick(field, i){
  const it=TA_ITEMS[i]; if(!it) return;
  const input=document.querySelector(`.cgrid input[data-attr="${field}"]`);
  if(input) input.value=it.value;
  taClose(field);
  WORK[CUR].compvals=readComponents();
  bindFromBuilder();
}

async function taQuery(field){
  const input=document.querySelector(`.cgrid input[data-attr="${field}"]`);
  if(!input) return;
  const q=input.value.trim();
  let url=`/api/terms?field=${field}&q=${encodeURIComponent(q)}`;
  if(field==="product"){
    const vi=document.querySelector('.cgrid input[data-attr="vendor"]');
    if(vi && vi.value.trim()) url+=`&vendor=${encodeURIComponent(vi.value.trim())}`;
  }
  const res=await api(url);
  if(res.ok) taRender(field, res.results||[]);
}

function taBind(field){
  const input=document.querySelector(`.cgrid input[data-attr="${field}"]`);
  if(!input) return;
  input.addEventListener("input",()=>{
    clearTimeout(TA_TIMER);
    TA_TIMER=setTimeout(()=>taQuery(field), 150);
  });
  input.addEventListener("focus",()=>taQuery(field));
  input.addEventListener("keydown",(e)=>{
    if(TA_FIELD!==field || !TA_ITEMS.length){
      if(e.key==="Escape") taClose(field);
      return;
    }
    if(e.key==="ArrowDown"){
      e.preventDefault(); TA_ACTIVE=Math.min(TA_ACTIVE+1, TA_ITEMS.length-1); taRender(field, TA_ITEMS);
    } else if(e.key==="ArrowUp"){
      e.preventDefault(); TA_ACTIVE=Math.max(TA_ACTIVE-1, 0); taRender(field, TA_ITEMS);
    } else if(e.key==="Enter" && TA_ACTIVE>=0){
      e.preventDefault(); e.stopPropagation(); taPick(field, TA_ACTIVE);
    } else if(e.key==="Escape"){
      taClose(field);
    }
  });
  input.addEventListener("blur",()=>setTimeout(()=>taClose(field), 120));
}

async function submit(verdict){
  const payload={index:CUR, verdict,
    annotated_title: verdict==="annotated" ? bracketString(CUR) : "",
    notes: document.getElementById("notes").value};
  if(verdict==="annotated"){
    const resolved=await resolveComponentsForSubmit();
    if(resolved && resolved.__invalid__){
      flash("WFN field does not validate: "+resolved.errors.join("; "), false);
      return;
    }
    if(resolved) payload.components=resolved;
    else {
      const comps=collectComponents();
      if(comps) payload.components=comps;
    }
  }
  const res=await api("/api/verdict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!res.ok){ flash(res.error, false); return; }
  STATE.rows[CUR]={...STATE.rows[CUR], ...res.row};
  STATE.progress=res.progress;
  flash("saved ✓", true);
  gotoNextPending();
}

function extraMarksOf(i){
  // the non-gold span marks (update/edition/...) as {token_index: [codes]}
  // — v/p/b are excluded, they're already fully covered by annotated_title.
  // Array-valued (2026-08-15) since a token can carry several extra tags
  // at once; initWork() also accepts the older single-string shape when
  // resuming a draft saved before this change.
  const {marks}=WORK[i]; const out={};
  marks.forEach((arr,k)=>{
    const extra=arr.filter(c=>!GOLD.has(c));
    if(extra.length) out[k]=extra;
  });
  return out;
}

async function submitDraft(){
  const payload={
    index: CUR,
    annotated_title: bracketString(CUR),
    notes: document.getElementById("notes").value,
    components: readComponents(),
    cpe_text: document.getElementById("wfnfield").value,
    extra_marks: extraMarksOf(CUR),
    llm_entities: WORK[CUR].llm||{},
  };
  const res=await api("/api/progress",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!res.ok){ flash(res.error, false); return; }
  STATE.rows[CUR]=res.row;
  flash("draft saved ✓", true);
  renderList();
}

function gotoNextPending(){
  const n=STATE.rows.length;
  for(let d=1; d<=n; d++){
    const j=(CUR+d)%n;
    if(isPending(rowStatus(STATE.rows[j]))){ CUR=j; render(); return; }
  }
  CUR=Math.min(CUR+1, n-1); render();
}

async function loadHistory(i){
  const res=await api(`/api/history?index=${i}`);
  if(i!==CUR) return; // stale response: the reviewer already moved on
  const box=document.getElementById("history");
  if(!box) return;
  if(!res.ok || !res.entries || !res.entries.length){
    box.innerHTML=`<div class="side-empty">No verdicts yet.</div>`;
    return;
  }
  box.innerHTML=res.entries.slice().reverse().map(e=>
    `<div class="hist-item"><span class="hist-v ${escapeHtml(e.verdict)}">${escapeHtml(e.verdict)}</span>`+
    `<span class="hist-meta">${escapeHtml(e.annotator)} &middot; ${escapeHtml(e.timestamp)}</span>`+
    (e.notes?`<div class="hist-notes">${escapeHtml(e.notes)}</div>`:"")+
    `</div>`
  ).join("");
}

function bindCard(){
  document.querySelectorAll(".ebtn").forEach(b=>b.onclick=()=>{
    const cls=b.dataset.e;
    const keys=selectedTokenKeys();
    if(keys.length){ keys.forEach(k=>paint(k, cls)); window.getSelection().removeAllRanges(); }
    else { ARMED=(ARMED===cls?null:cls);
      document.querySelectorAll(".ebtn").forEach(x=>x.classList.remove("armed"));
      if(ARMED!==null) b.classList.add("armed"); }
  });
  document.querySelectorAll("#title .tk").forEach(el=>el.onclick=()=>{
    if(ARMED!==null) paint(+el.dataset.k, ARMED);
  });
  const ap=document.getElementById("applysugg");
  if(ap) ap.onclick=()=>{
    const row=STATE.rows[CUR]; const w=WORK[CUR];
    [["suggested_vendor","v"],["suggested_product","p"]].forEach(([f,cls])=>{
      const words=(row[f]||"").replace(/_/g," ").split(/\s+/).filter(Boolean);
      if(!words.length) return;
      const low=w.tks.map(t=>t.trim().toLowerCase());
      for(let a=0;a<low.length;a++){
        let b=a, m=0, j=a;
        while(m<words.length && j<low.length){
          if(!low[j]){j++;continue;}
          if(low[j]!==words[m].toLowerCase()) break;
          b=j; m++; j++;
        }
        if(m===words.length){ for(let k=a;k<=b;k++) if(low[k]) paint(k, cls, {add:true}); break; }
      }
    });
  };
  const pf=document.getElementById("prefill");
  if(pf) pf.onclick=()=>{
    const set=(attr,v)=>{const el=document.querySelector(`.cgrid input[data-attr="${attr}"]`); if(el&&v) el.value=v.toLowerCase();};
    ENTITY_BUTTONS.forEach(eb=>set(eb.attr, spanText(eb.key)));
    WORK[CUR].compvals=readComponents();
    bindFromBuilder();
  };
  const bb=document.getElementById("bindbtn");
  if(bb) bb.onclick=()=>bindFromBuilder();
  document.querySelectorAll(".cgrid input, .cgrid select").forEach(i=>i.addEventListener(
    i.tagName==="SELECT" ? "change" : "input",
    ()=>{ WORK[CUR].compvals=readComponents(); clearTimeout(WFN_TIMER); WFN_TIMER=setTimeout(bindFromBuilder, 150); }
  ));
  const wf=document.getElementById("wfnfield");
  if(wf){
    wf.addEventListener("input",()=>{
      WORK[CUR].wfnText=wf.value;
      clearTimeout(WFN_TIMER); WFN_TIMER=setTimeout(unbindFromWfn, 300);
    });
    wf.addEventListener("blur",()=>{ clearTimeout(WFN_TIMER); unbindFromWfn(); });
  }
  TA_FIELDS.forEach(taBind);
  document.getElementById("save").onclick=()=>submit("annotated");
  document.getElementById("advreview").onclick=()=>openWizard();
  document.getElementById("savedraft").onclick=()=>submitDraft();
  document.getElementById("nosw").onclick=()=>submit("not_software");
  document.getElementById("skip").onclick=()=>submit("skipped");
  document.getElementById("prev").onclick=()=>{CUR=Math.max(0,CUR-1); render();};
  document.getElementById("next").onclick=()=>{CUR=Math.min(STATE.rows.length-1,CUR+1); render();};
}


// -- "Advanced review" wizard (design 2026-08-21) ------------------------
// vendor -> product -> version, one step each, then the other 8 components
// as plain fields. Every step asks POST /api/assist for candidates from the
// per-component helper registry; the source of each candidate is labelled
// (title / dictionary / llm / web / transform). Clicking a candidate fills
// the field AND remembers its title span; free text is always valid. "web"
// candidates are pre-built search links opened in a new tab (the server
// never fetches the web); "transform" candidates are explicit one-click
// rewrites (never silent). The LLM answer (when --assist-provider is on)
// is one call per title, cached in WORK/the draft and reused by every
// step; it is revalidated by the notary server-side and never auto-filled.
// Finish or exit both land in the normal builder with the fields and the
// title spans applied, then the usual bind/validate path runs.
const WIZ_STEPS=[
  {attr:"vendor", cls:"v", title:"Vendor", hint:"who makes it — pick a dictionary spelling when one matches"},
  {attr:"product", cls:"p", title:"Product", hint:"the product name only — candidates are filtered by the vendor you chose"},
  {attr:"version", cls:"b", title:"Version", hint:"version string only; service packs, builds and arch go to update / target_hw via the transforms"},
  {attr:null, title:"Other components", hint:"the remaining 8 components as plain fields — * = ANY, - = NA"},
];
const WIZ_REST=["part","update","edition","language","sw_edition","target_sw","target_hw","other"];
const SOURCE_ORDER=["title","dictionary","llm","transform","web"];
const SOURCE_COPY={title:"found in the title", dictionary:"official dictionary (reverse lookup)",
  llm:"LLM proposal — revalidated by the notary, never auto-filled", transform:"one-click transforms",
  web:"search the web (opens a new tab — you judge, the server never fetches)"};
let WIZ=null;

function openWizard(){
  const comps=readComponents();
  WIZ={step:0, values:comps, spans:{}, picked:{}, llm:WORK[CUR].llm||null, cands:{}, meta:null};
  renderWizard();
}

function wizStepDef(){ return WIZ_STEPS[WIZ.step]; }

function wizSetValue(attr, value, span, pickedKey){
  WIZ.values[attr]=value;
  if(span) WIZ.spans[attr]=span; else delete WIZ.spans[attr];
  WIZ.picked[attr]=pickedKey||null;
}

function wizTitleHtml(){
  const {tks}=WORK[CUR];
  const step=wizStepDef();
  const span=step.attr ? WIZ.spans[step.attr] : null;
  return tks.map((t,k)=>{
    const hl=span && k>=span[0] && k<=span[1] && t.trim();
    return hl ? `<span class="hl">${escapeHtml(t)}</span>` : escapeHtml(t);
  }).join("");
}

function wizCandHtml(c, i){
  const key=`${c.source}:${i}`;
  if(c.source==="web"){
    return `<a class="wcand link" href="${escapeHtml(c.url||"#")}" target="_blank" rel="noopener noreferrer">${escapeHtml(c.value)} ↗<small>${escapeHtml(c.evidence||"")}</small></a>`;
  }
  const picked=WIZ.picked[wizStepDef().attr]===key;
  const cls="wcand"+(picked?" picked":"")+(c.invalid?" invalid":"");
  return `<button class="${cls}" data-i="${i}" ${c.invalid?"disabled":""}>${escapeHtml(c.value)}<small>${escapeHtml(c.evidence||"")}</small></button>`;
}

function wizSourcesHtml(){
  const step=wizStepDef();
  const cands=WIZ.cands[step.attr];
  if(cands===undefined) return `<div class="wiz-empty">asking the helpers…</div>`;
  const groups={};
  cands.forEach((c,i)=>{ (groups[c.source]=groups[c.source]||[]).push([c,i]); });
  const meta=WIZ.meta||{};
  let html="";
  SOURCE_ORDER.forEach(src=>{
    const list=groups[src]||[];
    let note="";
    if(src==="llm" && !list.length){
      if(!(meta.llm&&meta.llm.enabled)) note=`<div class="wiz-empty">no LLM assistant configured (start cpegen review with --assist-provider)</div>`;
      else if(meta.llm.pending) note=`<div class="wiz-empty">asking ${escapeHtml(meta.llm.provider||"the model")}… (local candidates above are already usable; this fills in when it answers)</div>`;
      else if(meta.llm.error) note=`<div class="wiz-empty">LLM error: ${escapeHtml(meta.llm.error)} — reopen the wizard to retry</div>`;
      else note=`<div class="wiz-empty">the LLM proposed nothing for this component</div>`;
    } else if(src==="dictionary" && step.attr==="version" && !list.length){
      return; // the dictionary never indexed versions (decision 2026-08-14): nothing to say here
    } else if((src==="title"||src==="dictionary") && !list.length){
      note=meta.terms===false
        ? `<div class="wiz-empty">no dictionary sidecar loaded — run 'cpegen dict --export-terms'</div>`
        : `<div class="wiz-empty">no match</div>`;
    } else if(!list.length){
      if(src==="transform") return; // nothing applicable: hide the group
      note=`<div class="wiz-empty">—</div>`;
    }
    html+=`<div class="wiz-src"><div class="wiz-src-head"><span class="wsrc ${src}">${src}</span>${SOURCE_COPY[src]}</div>`+
      `<div class="wcands">${list.map(([c,i])=>wizCandHtml(c,i)).join("")}</div>${note}</div>`;
  });
  return html;
}

function wizRestHtml(){
  return `<div class="wiz-rest">${WIZ_REST.map(a=>{
    const val=escapeHtml(WIZ.values[a]||(a==="part"?"*":"*"));
    if(a==="part") return `<label class="cfield"><span>part</span><select data-wattr="part">`+
      PART_VALUES.map(p=>`<option value="${p}"${p===val?" selected":""}>${p}</option>`).join("")+`</select></label>`;
    return `<label class="cfield"><span>${a}</span><input data-wattr="${a}" value="${val}"></label>`;
  }).join("")}</div>`;
}

function renderWizard(){
  let ov=document.getElementById("wiz");
  if(!ov){ ov=document.createElement("div"); ov.id="wiz"; ov.className="wiz-overlay"; document.body.appendChild(ov); }
  const step=wizStepDef();
  const last=WIZ.step===WIZ_STEPS.length-1;
  ov.innerHTML=`<div class="wiz" role="dialog" aria-label="Advanced review">
    <div class="wiz-head"><h2>Advanced review</h2>
      <span class="wiz-note">${escapeHtml(step.hint)}</span>
      <div class="wiz-steps">${WIZ_STEPS.map((s,i)=>`<span class="wstep${i===WIZ.step?" cur":i<WIZ.step?" done":""}">${i+1} ${s.title}</span>`).join("")}</div>
    </div>
    <div class="wiz-title" id="wiztitle">${wizTitleHtml()}</div>
    ${step.attr ? `<div class="wiz-field"><label>${step.attr}</label><input id="wizinput" autocomplete="off" spellcheck="false" value="${escapeHtml(WIZ.values[step.attr]&&WIZ.values[step.attr]!=="*"?WIZ.values[step.attr]:"")}" placeholder="free text is always valid — or click a candidate below"></div>
      <div id="wizsources">${wizSourcesHtml()}</div>` : wizRestHtml()}
    <div class="wiz-actions">
      <button class="abtn draft" id="wizexit" title="Apply what is filled so far to the builder and close">Exit to builder</button>
      <span class="wiz-note">Esc = exit · helpers propose, the notary validates</span>
      <div class="nav">
        <button class="nbtn" id="wizback" ${WIZ.step===0?"disabled":""}>&larr; Back</button>
        ${last ? `<button class="abtn save" id="wizfinish">Finish → builder</button>` : `<button class="abtn save" id="wiznext">Next &rarr;</button>`}
      </div>
    </div></div>`;
  bindWizard();
  if(step.attr && WIZ.cands[step.attr]===undefined) wizAssist(step.attr);
}

function wizReadStep(){
  const step=wizStepDef();
  if(step.attr){
    const inp=document.getElementById("wizinput");
    if(inp){
      const v=inp.value.trim();
      if(v!==(WIZ.values[step.attr]||"")){ wizSetValue(step.attr, v, null, null); }  // free text: no span claim
    }
  } else {
    document.querySelectorAll("#wiz [data-wattr]").forEach(el=>{ WIZ.values[el.dataset.wattr]=el.value.trim(); });
  }
}

function bindWizard(){
  const step=wizStepDef();
  document.getElementById("wizexit").onclick=()=>wizFinish();
  const nx=document.getElementById("wiznext"); if(nx) nx.onclick=()=>{ wizReadStep(); WIZ.step++; delete WIZ.cands[wizStepDef().attr]; renderWizard(); };
  const fn=document.getElementById("wizfinish"); if(fn) fn.onclick=()=>wizFinish();
  const bk=document.getElementById("wizback"); if(bk) bk.onclick=()=>{ wizReadStep(); WIZ.step--; delete WIZ.cands[wizStepDef().attr]; renderWizard(); };
  const inp=document.getElementById("wizinput");
  if(inp){
    inp.addEventListener("input",()=>{ wizSetValue(step.attr, inp.value.trim(), null, null); wizPaintTitle(); wizRefreshPicked(); });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); (nx||fn).click(); } });
    setTimeout(()=>inp.focus(), 0);
  }
  bindWizardCands();
  document.getElementById("wiz").onclick=(e)=>{ if(e.target.id==="wiz") wizFinish(); };
}

function bindWizardCands(){
  const step=wizStepDef();
  document.querySelectorAll("#wizsources .wcand:not(.link)").forEach(b=>b.onclick=()=>{
    const c=WIZ.cands[step.attr][+b.dataset.i];
    if(!c || c.invalid) return;
    if(c.source==="transform" && c.apply){
      Object.entries(c.apply).forEach(([attr,val])=>{ WIZ.values[attr]=val; });
      if(c.apply[step.attr]!==undefined){ wizSetValue(step.attr, c.apply[step.attr], null, `${c.source}:${b.dataset.i}`); }
      renderWizard(); return;
    }
    wizSetValue(step.attr, c.value, c.span||null, `${c.source}:${b.dataset.i}`);
    const i2=document.getElementById("wizinput"); if(i2) i2.value=c.value;
    wizPaintTitle(); wizRefreshPicked();
  });
}

function wizPaintTitle(){ const t=document.getElementById("wiztitle"); if(t) t.innerHTML=wizTitleHtml(); }
function wizRefreshPicked(){
  const step=wizStepDef();
  document.querySelectorAll("#wizsources .wcand:not(.link)").forEach(b=>{
    const key=`${WIZ.cands[step.attr][+b.dataset.i].source}:${b.dataset.i}`;
    b.classList.toggle("picked", WIZ.picked[step.attr]===key);
  });
}

async function wizAssist(attr){
  // Two phases, so a slow local model never blocks the deterministic
  // helpers (feedback 2026-08-21: a 120 s LM Studio timeout froze the whole
  // step on "asking the helpers…"): 1) use_llm:false -> title/dictionary/
  // transform/web candidates render immediately; 2) a second call with the
  // LLM, whose candidates are merged into the same list when they arrive.
  // One LLM call per title: the entities a previous step cached are handed
  // back, so phase 2 is instant after the first step.
  const base={component:attr, title:STATE.rows[CUR].title, components:WIZ.values};
  const post=(body)=>api("/api/assist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const local=await post({...base, use_llm:false});
  if(!WIZ || wizStepDef().attr!==attr) return;  // stale: the reviewer moved on
  if(!local.ok){ WIZ.cands[attr]=[]; WIZ.meta={terms:false, llm:{enabled:false}}; wizRepaintSources(); return; }
  WIZ.cands[attr]=(local.candidates||[]).filter(c=>c.source!=="llm");
  WIZ.meta={terms:local.terms, llm:{...(local.llm||{enabled:false}), pending:!!(local.llm&&local.llm.enabled)}};
  wizRepaintSources();
  if(!(local.llm&&local.llm.enabled)) return;
  const payload={...base};
  if(WIZ.llm) payload.llm_entities=WIZ.llm;
  const res=await post(payload);
  if(!WIZ || wizStepDef().attr!==attr) return;
  if(res.ok){
    WIZ.cands[attr]=WIZ.cands[attr].concat((res.candidates||[]).filter(c=>c.source==="llm"));
    WIZ.meta.llm={...(res.llm||{enabled:true}), pending:false};
    if(res.llm_entities && Object.keys(res.llm_entities).length){ WIZ.llm=res.llm_entities; WORK[CUR].llm=res.llm_entities; }
  } else {
    WIZ.meta.llm={enabled:true, error:res.error||"assist call failed", pending:false};
  }
  wizRepaintSources();
}

function wizRepaintSources(){
  const box=document.getElementById("wizsources");
  if(box){ box.innerHTML=wizSourcesHtml(); bindWizardCands(); }
}

// Apply the wizard's state to the normal workspace: builder fields (all 11),
// title spans for every candidate that came with one (gold classes for
// vendor/product/version, the amber extra marks for the rest), then the
// usual bind & validate. Used by Finish, Exit, Esc and the backdrop click
// alike — leaving the wizard never loses what was filled.
function wizFinish(){
  if(!WIZ) return;
  wizReadStep();
  const w=WORK[CUR];
  CPE_ATTRS.forEach(a=>{
    const el=document.querySelector(`.cgrid [data-attr="${a}"]`);
    if(!el) return;
    const v=WIZ.values[a];
    if(v!==undefined && v!=="") el.value=v;
  });
  Object.entries(WIZ.spans).forEach(([attr,span])=>{
    const eb=ENTITY_BUTTONS.find(x=>x.attr===attr); if(!eb||!span) return;
    for(let k=span[0];k<=span[1];k++) paint(k, eb.key, {add:true});
  });
  w.compvals=readComponents();
  if(WIZ.llm) w.llm=WIZ.llm;
  WIZ=null;
  const ov=document.getElementById("wiz"); if(ov) ov.remove();
  updatePreview();
  bindFromBuilder();
}

document.addEventListener("keydown", e=>{
  if(WIZ){ if(e.key==="Escape") wizFinish(); return; }  // the wizard owns the keyboard while open
  const tag=e.target.tagName;
  if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") { if(e.key==="Enter" && tag!=="TEXTAREA"){e.preventDefault(); submit("annotated");} return; }
  const k=e.key.toLowerCase();
  if(k==="v"||k==="p"||k==="b") assign(k);
  else if(k==="x") assign("");
  else if(k==="enter"){ e.preventDefault(); submit("annotated"); }
  else if(k==="n") submit("not_software");
  else if(k==="s") submit("skipped");
  else if(e.key==="ArrowLeft"){ CUR=Math.max(0,CUR-1); render(); }
  else if(e.key==="ArrowRight"){ CUR=Math.min(STATE.rows.length-1,CUR+1); render(); }
});

document.querySelectorAll(".ftab").forEach(b=>b.onclick=()=>{
  FILTER=b.dataset.f;
  document.querySelectorAll(".ftab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  renderList();
});

(async function(){
  STATE=await api("/api/state");
  // start at the first pending row (blank, skipped, or in_progress)
  CUR=STATE.rows.findIndex(r=>isPending(r.verdict));
  if(CUR<0) CUR=0;
  render();
})();
</script>
</body>
